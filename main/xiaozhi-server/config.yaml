TTS:
  # Các type hiện hỗ trợ: edge, doubao, có thể tự mở rộng thêm
  EdgeTTS:
    # Định nghĩa loại TTS API
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "中文"  # Chỉ định ngôn ngữ đầu ra, như: tiếng Trung, tiếng Anh, tiếng Nhật, tiếng Hàn..., hãy đặt theo ngôn ngữ giọng đã chọn hỗ trợ, không điền mặc định là tiếng Trung
  DoubaoTTS:
    # Định nghĩa loại TTS API
    type: doubao
    # Dịch vụ tổng hợp giọng nói Volcengine, cần tạo ứng dụng trong console Volcengine và lấy appid, access_token trước
    # Giọng nói Volcengine nhất định phải mua trả phí, giá khởi điểm 30 tệ là có 100 luồng đồng thời. Bản miễn phí chỉ có 2 luồng, sẽ thường xuyên báo lỗi TTS
    # Sau khi mua dịch vụ và mua giọng miễn phí, có thể phải đợi khoảng nửa tiếng mới dùng được.
    # Mở giọng thường tại đây: https://console.volcengine.com/speech/service/8
    # Mở giọng 湾湾小何 (giọng Đài Loan) tại đây: https://console.volcengine.com/speech/service/10007, sau khi mở đặt voice bên dưới thành zh_female_wanwanxiaohe_moon_bigtts
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "中文"  # Chỉ định ngôn ngữ đầu ra, như: tiếng Trung, tiếng Anh, tiếng Nhật, tiếng Hàn..., hãy đặt theo ngôn ngữ giọng đã chọn hỗ trợ, không điền mặc định là tiếng Trung
  #Volcengine TTS, hỗ trợ TTS streaming hai chiều
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Truy cập https://console.volcengine.com/speech/service/10007 để mở model lớn tổng hợp giọng nói, mua giọng
    # Lấy appid và access_token ở cuối trang
    # Resource ID cố định: volc.service_type.10029 (tổng hợp giọng nói model lớn và mix)
    # Nếu dùng Gizwits, đổi địa chỉ giao diện thành wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits không cần điền appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Bật tái sử dụng kết nối WebSocket, mặc định tái sử dụng (lưu ý: sau khi tái sử dụng, kết nối rảnh khi thiết bị ở trạng thái nghe sẽ chiếm số luồng đồng thời)
    enable_ws_reuse: True
    # Tài liệu tham số liên quan: https://www.volcengine.com/docs/6561/1329505
    # Cấu hình đầu ra audio (audio_params) - người dùng có thể tự thêm bất kỳ tham số audio nào Volcengine hỗ trợ
    audio_params:
      speech_rate: 0  # Tốc độ nói (-50~100)
      loudness_rate: 0  # Âm lượng (-50~100)
      # Tham số giọng đa cảm xúc, lưu ý: hiện chỉ một số giọng hỗ trợ đặt cảm xúc.
      # Danh sách giọng liên quan: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # Loại cảm xúc (chỉ một số giọng hỗ trợ): neutral, happy, sad, angry, fearful, disgusted, surprised
      # emotion_scale: 4  # Cường độ cảm xúc (1~5)
    # Cấu hình xử lý văn bản nâng cao (additions) - người dùng có thể tự thêm bất kỳ tham số nâng cao nào Volcengine hỗ trợ
    additions:
      post_process:
        pitch: 0  # Cao độ (-12~12)
      # aigc_metadata: {}  # Cấu hình metadata AIGC
      # cache_config: {}  # Cấu hình cache
    # Cấu hình điều khiển mix (mix_speaker) - trộn nhiều giọng (chỉ TTS 1.0)
    # Tính năng mix chủ yếu dùng cho giọng của model tổng hợp giọng nói Doubao 1.0, khi dùng cần đặt req_params.speaker thành custom_mix_bigtts
    # mix_speaker:
    #   speakers:
    #     - source_speaker: zh_male_bvlazysheep
    #       mix_factor: 0.3
    #     - source_speaker: BV120_streaming
    #       mix_factor: 0.3
    #     - source_speaker: zh_male_ahu_conversation_wvae_bigtts
    #       mix_factor: 0.4
    # language: "中文"  # Chỉ định ngôn ngữ đầu ra, như: tiếng Trung, tiếng Anh, tiếng Nhật, tiếng Hàn..., hãy đặt theo ngôn ngữ giọng đã chọn hỗ trợ, không điền mặc định là tiếng Trung
  #Model tổng hợp giọng nói Doubao 2.0, hỗ trợ TTS streaming hai chiều (dựa trên tài nguyên seed-tts-2.0)
  HuoshanDoubleStreamTTSV2:
    type: huoshan_double_stream
    # Truy cập https://console.volcengine.com/speech/service/10035 để mở model lớn tổng hợp giọng nói, mua giọng
    # Lấy appid và access_token ở cuối trang
    # Resource ID cố định: seed-tts-2.0 (model tổng hợp giọng nói Doubao 2.0)
    # Nếu dùng Gizwits, đổi địa chỉ giao diện thành wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits không cần điền appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: seed-tts-2.0
    speaker: zh_female_xiaohe_uranus_bigtts
    # Bật tái sử dụng kết nối WebSocket, mặc định tái sử dụng (lưu ý: sau khi tái sử dụng, kết nối rảnh khi thiết bị ở trạng thái nghe sẽ chiếm số luồng đồng thời)
    enable_ws_reuse: True
    # Tài liệu tham số liên quan: https://www.volcengine.com/docs/6561/1329505
    # Cấu hình đầu ra audio (audio_params) - người dùng có thể tự thêm bất kỳ tham số audio nào Volcengine hỗ trợ
    audio_params:
      speech_rate: 0  # Tốc độ nói (-50~100)
      loudness_rate: 0  # Âm lượng (-50~100)
    # Cấu hình xử lý văn bản nâng cao (additions) - người dùng có thể tự thêm bất kỳ tham số nâng cao nào Volcengine hỗ trợ
    additions:
