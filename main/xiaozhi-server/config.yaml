    model_name: qwen-flash
    api_key: 你的deepseek web key
    temperature: 0.7  # Giá trị temperature
    max_tokens: 500   # Số token sinh tối đa
    top_p: 1
    frequency_penalty: 0  # Phạt tần suất
  AliAppLLM:
    # Định nghĩa loại LLM API
