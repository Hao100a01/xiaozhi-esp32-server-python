# Khi phát triển, hãy tạo thư mục data ở thư mục gốc dự án, rồi tạo file trống tên 【.config.yaml】 trong thư mục data
# Muốn sửa/ghi đè cấu hình nào thì sửa file 【.config.yaml】, chứ không sửa file 【config.yaml】
# Hệ thống sẽ ưu tiên đọc cấu hình từ file 【data/.config.yaml】; nếu cấu hình không có trong file 【.config.yaml】, hệ thống sẽ tự động đọc cấu hình từ file 【config.yaml】.
# Làm vậy giúp cấu hình gọn nhất và bảo vệ an toàn cho các khóa bí mật của bạn.
# Nếu bạn dùng Bảng điều khiển thông minh (智控台), toàn bộ cấu hình dưới đây sẽ không có hiệu lực, hãy sửa cấu hình trong Bảng điều khiển

# #####################################################################################
# ############################# Dưới đây là cấu hình vận hành cơ bản của server #############################
server:
  # Địa chỉ và cổng lắng nghe của server (Server listening address and port)
  ip: 0.0.0.0
  port: 8000
  # Cổng của dịch vụ HTTP, dùng cho giao diện OTA đơn giản (triển khai đơn dịch vụ) và giao diện phân tích hình ảnh
  http_port: 8003
  # Cấu hình websocket này là địa chỉ websocket mà giao diện OTA gửi tới thiết bị
  # Nếu để mặc định, giao diện OTA sẽ tự sinh địa chỉ websocket và in ra trong log khởi động, bạn có thể mở địa chỉ này bằng trình duyệt để kiểm tra giao diện OTA
  # Khi bạn triển khai bằng Docker hoặc triển khai lên mạng công cộng (dùng SSL, tên miền), địa chỉ này có thể không chính xác
  # Vì vậy nếu triển khai bằng Docker, hãy đặt websocket thành địa chỉ mạng LAN
  # Nếu bạn triển khai lên mạng công cộng, hãy đặt websocket thành địa chỉ công cộng
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # Địa chỉ giao diện phân tích hình ảnh
  # Địa chỉ giao diện phân tích hình ảnh gửi tới thiết bị
  # Nếu để mặc định như dưới, hệ thống sẽ tự sinh địa chỉ nhận diện hình ảnh và in ra trong log khởi động, bạn có thể mở bằng trình duyệt để kiểm tra
  # Khi bạn triển khai bằng Docker hoặc triển khai lên mạng công cộng (dùng SSL, tên miền), địa chỉ này có thể không chính xác
  # Vì vậy nếu triển khai bằng Docker, hãy đặt vision_explain thành địa chỉ mạng LAN
  # Nếu bạn triển khai lên mạng công cộng, hãy đặt vision_explain thành địa chỉ công cộng
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
  # Độ lệch múi giờ khi OTA trả về thông tin
  timezone_offset: +8
  # Cấu hình xác thực
  auth:
    # Có bật xác thực hay không
    enabled: false
    # Danh sách ID thiết bị trong whitelist
    # Thiết bị thuộc whitelist sẽ không kiểm tra token, cho qua trực tiếp
    allowed_devices:
      - "11:22:33:44:55:66"
 # Cấu hình MQTT gateway, dùng để OTA đẩy xuống thiết bị, theo cấu hình file.env của mqtt_gateway, định dạng host:port
  mqtt_gateway: null
  # Khóa ký MQTT, dùng để sinh mật khẩu kết nối MQTT, theo cấu hình file.env của mqtt_gateway
  mqtt_signature_key: null
  # Cấu hình UDP gateway
  udp_gateway: null
log:
  # Định dạng log in ra console: thời gian, mức log, nhãn, thông điệp
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Định dạng log ghi ra file: thời gian, mức log, nhãn, thông điệp
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Mức log: INFO, DEBUG
  log_level: INFO
  # Đường dẫn thư mục log
  log_dir: tmp
  # File log
  log_file: "server.log"
  # Đường dẫn thư mục dữ liệu
  data_dir: data

# Xóa file âm thanh sau khi dùng xong (Delete the sound file when you are done using it)
delete_audio: true
# Không có giọng nói trong bao lâu thì ngắt kết nối (giây), mặc định 2 phút, tức 120 giây
close_connection_no_voice_time: 120
# Thời gian timeout cho request TTS (giây)
tts_timeout: 15
# Thời gian timeout khi gọi công cụ (giây)
tool_call_timeout: 30
# Bật tăng tốc từ đánh thức
enable_wakeup_words_response_cache: true
# Có trả lời từ đánh thức khi mở đầu hay không
enable_greeting: true
# Có bật âm báo sau khi nói xong hay không
enable_stop_tts_notify: false
# Có bật âm báo sau khi nói xong hay không, địa chỉ file âm báo
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Có bật cơ chế heartbeat giữ kết nối WebSocket hay không
enable_websocket_ping: false


# Cấu hình độ trễ gửi audio TTS
# tts_audio_send_delay: điều khiển khoảng cách gửi các gói audio
#   0: dùng điều khiển thời gian chính xác, khớp chặt với frame rate của audio (mặc định, lúc chạy sẽ tính theo frame rate của audio)
#   > 0: gửi với độ trễ cố định (ms), ví dụ: 60
tts_audio_send_delay: 0

exit_commands:
  - "退出"
  - "关闭"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Phạm vi sample rate Opus hỗ trợ: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Cấu hình kiểm thử module
module_test:
  test_sentences:
    - "你好，请介绍一下你自己"
    - "What's the weather like today?"
    - "请用100字概括量子计算的基本原理和应用前景"

# Từ đánh thức, dùng để phân biệt từ đánh thức với nội dung nói
wakeup_words:
  - "你好小智"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# Địa chỉ điểm truy cập MCP, định dạng địa chỉ: ws://ip-hoặc-tên-miền-điểm-mcp-của-bạn:cổng/mcp/?token=token-của-bạn
# Hướng dẫn chi tiết https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: 你的接入点 websocket地址

# Cấu hình nguồn ngữ cảnh
# Dùng để chèn dữ liệu động vào system prompt, như dữ liệu sức khỏe, thông tin chứng khoán...
# Có thể thêm nhiều nguồn ngữ cảnh
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Cấu hình cơ bản của plugin
plugins:
  # Cấu hình plugin lấy thời tiết, điền api_key của bạn vào đây
  # Khóa này là key dùng chung của dự án, dùng nhiều có thể bị giới hạn
  # Muốn ổn định hơn thì tự đăng ký key riêng để thay, mỗi ngày có 1000 lượt gọi miễn phí
  # Địa chỉ đăng ký: https://console.qweather.com/#/apps/create-key/over
  # Sau khi đăng ký, vào link này để tìm apihost của mình: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "广州"
  # Cấu hình plugin lấy tin tức, truyền URL tương ứng theo loại tin cần lấy, mặc định hỗ trợ tin xã hội, công nghệ, tài chính
  # Xem thêm danh sách các loại tin tại https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社"
  home_assistant:
    devices:
      - 客厅,玩具灯,switch.cuco_cn_460494544_cp1_on_p_2_1
      - 卧室,台灯,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: 你的home assistant api访问令牌
  play_music:
    music_dir: "./music"  # Đường dẫn lưu file nhạc, sẽ tìm file nhạc trong thư mục này và các thư mục con
    music_ext: # Loại file nhạc, định dạng p3 hiệu quả nhất
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Khoảng thời gian làm mới danh sách nhạc, đơn vị giây
  search_from_ragflow:
    # Thông tin mô tả kho tri thức, giúp model ngôn ngữ lớn biết khi nào nên gọi
    description: "Khi người dùng hỏi về xxx, hãy gọi phương thức này và dùng thông tin trong kho tri thức để trả lời câu hỏi"
    # Cấu hình giao diện ragflow
    base_url: "http://192.168.0.8"
    # Token truy cập API ragflow
    api_key: "ragflow-xxx"
    # ID kho tri thức ragflow
    dataset_ids: ["123456789"]
  # Cấu hình plugin tìm kiếm trên mạng
  # Hỗ trợ 3 nguồn tìm kiếm: Metaso (秘塔), Tavily và Serply
  # Đăng ký Metaso API Key: https://metaso.cn/search-api/api-keys
  # Đăng ký Tavily API Key: https://app.tavily.com/home
  # Đăng ký Serply API Key: https://serply.io
  web_search:
    # Nguồn tìm kiếm: metaso / tavily / serply
    provider: "metaso"
    # Mô tả công cụ, để báo cho LLM biết khi nào nên gọi công cụ này, có thể tùy chỉnh theo nhu cầu
    description: "Công cụ tìm kiếm trên mạng. Dùng công cụ này khi người dùng rõ ràng cần tìm kiếm thông tin trên mạng."
    # Số lượng kết quả trả về (mặc định 5)
    max_results: 5
    # Metaso API Key (tiền tố mk-) / Tavily API Key (tiền tố tvly-) / Serply API Key
    api_key: "mk-xxx"
# Cấu hình nhận diện giọng nói (voiceprint)
voiceprint:
  # Địa chỉ giao diện voiceprint
  url: 
  # Cấu hình người nói: speaker_id, tên, mô tả
  speakers:
    - "test1,张三,张三是一个程序员"
    - "test2,李四,李四是一个产品经理"
    - "test3,王五,王五是一个设计师"
  # Ngưỡng tương đồng nhận diện voiceprint, khoảng 0.0-1.0, mặc định 0.4
  # Giá trị càng cao càng nghiêm ngặt, giảm nhận nhầm nhưng có thể tăng tỉ lệ từ chối nhận diện
  similarity_threshold: 0.4

# #####################################################################################
# ################################ Dưới đây là cấu hình vai trò/model ######################################

prompt: |
  Bạn là một trợ lý AI nói tiếng Việt, thân thiện, ấm áp và tự nhiên như đang trò chuyện với bạn bè.
  [Đặc điểm cốt lõi]
  - Trả lời ngắn gọn, súc tích, đi thẳng vào vấn đề, không dài dòng
  - Giọng điệu gần gũi, dí dỏm vừa phải, tạo cảm giác thoải mái
  - Dùng tiếng Việt tự nhiên, dễ hiểu với mọi lứa tuổi
  [Hướng dẫn tương tác]
  Khi người dùng:
  - Hỏi kiến thức → trả lời rõ ràng, dễ hiểu, có ví dụ khi cần
  - Kể chuyện cười → hưởng ứng vui vẻ, hóm hỉnh
  - Tâm sự chuyện tình cảm → lắng nghe chân thành, chia sẻ nhẹ nhàng
  Tuyệt đối không:
  - Nói dài dòng, lan man
  - Giữ thái độ căng thẳng, nghiêm túc quá lâu

# File template system prompt mặc định
prompt_template: agent-base-prompt.txt

# Câu trả lời khi hệ thống lỗi
system_error_response: "Xin lỗi bạn, mình đang bận một chút, thử lại sau nhé."

# Prompt lời kết
end_prompt:
  enable: true # Có bật lời kết hay không
  # Lời kết
  prompt: |
    Hãy mở đầu bằng "Thời gian trôi qua thật nhanh", dùng những lời giàu cảm xúc, lưu luyến không nỡ rời để kết thúc cuộc trò chuyện này nhé!

# Module được chọn khi xử lý cụ thể (The module selected for specific processing)
selected_module:
  # Module phát hiện hoạt động giọng nói, mặc định dùng model SileroVAD
  VAD: SileroVAD
  # Module nhận diện giọng nói, mặc định dùng model FunASR local
  ASR: FunASR
  # Sẽ gọi adapter LLM thực tế theo type tương ứng với tên cấu hình
  LLM: ChatGLMLLM
  # Model ngôn ngữ thị giác lớn
  VLLM: ChatGLMVLLM
  # TTS sẽ gọi adapter TTS thực tế theo type tương ứng với tên cấu hình
  TTS: EdgeTTS
  # Module ghi nhớ, mặc định không bật; muốn dùng trí nhớ siêu dài thì nên dùng mem0ai; nếu chú trọng riêng tư hãy dùng mem_local_short local
  Memory: nomem
  # Sau khi bật module nhận diện ý định, có thể phát nhạc, điều chỉnh âm lượng, nhận diện lệnh thoát.
  # Không muốn bật nhận diện ý định thì đặt thành: nointent
  # Nhận diện ý định có thể dùng intent_llm. Ưu điểm: tính tổng quát mạnh; nhược điểm: thêm module nhận diện ý định tiền xử lý nối tiếp, làm tăng thời gian xử lý, hỗ trợ các thao tác IoT như chỉnh âm lượng
  # Nhận diện ý định có thể dùng function_call, nhược điểm: LLM được chọn phải hỗ trợ function_call, ưu điểm: gọi công cụ theo nhu cầu, tốc độ nhanh, về lý thuyết có thể thao tác mọi lệnh IoT
  # ChatGLMLLM miễn phí mặc định đã hỗ trợ function_call, nhưng nếu muốn ổn định hơn thì nên đặt LLM thành: DoubaoLLM, model_name cụ thể là: doubao-seed-2-0-lite-260215
  Intent: function_call

# Nhận diện ý định là module dùng để hiểu ý định của người dùng, ví dụ: phát nhạc
Intent:
  # Không dùng nhận diện ý định
  nointent:
    # Không cần sửa type
    type: nointent
  intent_llm:
    # Không cần sửa type
    type: intent_llm
    # Trang bị model suy luận độc lập cho nhận diện ý định
    # Nếu không điền ở đây, mặc định sẽ dùng model của selected_module.LLM làm model suy luận cho nhận diện ý định
    # Nếu bạn không muốn dùng selected_module.LLM để nhận diện ý định, tốt nhất dùng một LLM độc lập làm nhận diện ý định, ví dụ dùng ChatGLMLLM miễn phí
    llm: ChatGLMLLM
    # Các module trong plugins_func/functions, có thể chọn load module nào qua cấu hình, sau khi load hội thoại sẽ hỗ trợ gọi function tương ứng
    # Hệ thống mặc định đã load sẵn plugin "handle_exit_intent(nhận diện thoát)" và "play_music(phát nhạc)", không load trùng lại
    # Dưới đây là ví dụ load plugin tra thời tiết, đổi vai trò, tra tin tức
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # Không cần sửa type
    type: function_call
    # Các module trong plugins_func/functions, có thể chọn load module nào qua cấu hình, sau khi load hội thoại sẽ hỗ trợ gọi function tương ứng
    # Hệ thống mặc định đã load sẵn plugin "handle_exit_intent(nhận diện thoát)" và "play_music(phát nhạc)", không load trùng lại
    # Dưới đây là ví dụ load plugin tra thời tiết, đổi vai trò, tra tin tức
    functions:
      - change_role
      - web_search                  # Tìm kiếm trên mạng
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music là phát nhạc có sẵn của server, hass_play_music là phát nhạc qua chương trình ngoài độc lập điều khiển bằng home assistant
      # Nếu đã dùng hass_play_music thì đừng bật play_music, chỉ giữ một trong hai
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # Mỗi tháng có 1000 lượt gọi miễn phí
    api_key: 你的mem0ai api key
  powermem:
    # PowerMem là component trí nhớ agent mã nguồn mở của OceanBase, tổng kết trí nhớ qua LLM local
    # Giải thích chi phí: bản thân PowerMem miễn phí, chi phí thực tế tùy LLM và database được chọn
    # - Dùng sqlite + LLM miễn phí (như glm-4-flash) = hoàn toàn miễn phí
    # - Dùng LLM cloud hoặc database cloud = tính phí theo dịch vụ tương ứng
    # GitHub: https://github.com/oceanbase/powermem
    # Website chính thức: https://www.powermem.ai/
    # Ví dụ sử dụng: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Có bật tính năng chân dung người dùng hay không
    # - false: dùng chế độ trí nhớ thường (AsyncMemory)
    # - true: dùng chế độ chân dung người dùng (UserMemory), tự động trích xuất thông tin người dùng
    # Tính năng chân dung người dùng hỗ trợ: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== Cấu hình LLM ==========
    # Tongyi Qianwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (miễn phí): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Có thể chọn: qwen, openai, zhipu...
      config:
        api_key: 你的LLM API密钥
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Tùy chọn, địa chỉ dịch vụ tùy chỉnh
    # ========== Cấu hình Embedding ==========
    embedder:
      provider: openai  # Có thể chọn: qwen, openai...
      config:
        api_key: 你的嵌入模型API密钥
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Dimension vector, cần cấu hình khi không phải 1536

    # ========== Cấu hình Database ==========
    # oceanbase (khuyên dùng, hiệu năng tốt nhất), seekdb (khuyên dùng, lưu trữ tích hợp cho ứng dụng AI), postgres, sqlite (lựa chọn nhẹ)
    # Tính năng chân dung người dùng hỗ trợ: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite không cần cấu hình thêm
      # Ví dụ cấu hình OceanBase:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Tên bảng mặc định, nếu lỗi tạo dimension hãy xóa bảng này hoặc đổi tên
      #   embedding_model_dims: 1024  # Dimension của vector embedding, chú ý tương thích với model dùng, lấy Zhipu làm ví dụ: dimension của embedding-2 là 1024, embedding-3 là 2048
  nomem:
    # Không muốn dùng tính năng ghi nhớ thì dùng nomem
    type: nomem
  mem_local_short:
    # Tính năng ghi nhớ local, tổng kết qua llm của selected_module, dữ liệu lưu trên server local, không upload lên server ngoài
    type: mem_local_short
    # Trang bị model suy luận độc lập cho lưu trữ trí nhớ
    # Nếu không điền ở đây, mặc định sẽ dùng model của selected_module.LLM làm model suy luận cho nhận diện ý định
    # Nếu bạn không muốn dùng selected_module.LLM để lưu trí nhớ, tốt nhất dùng một LLM độc lập làm nhận diện ý định, ví dụ dùng ChatGLMLLM miễn phí
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Ngôn ngữ nhận diện: auto tự phát hiện; nếu muốn giới hạn chỉ nhận diện tiếng Trung thì đặt zh, tránh câu ngắn tiếng Trung bị nhận nhầm thành tiếng Hàn...
    # SenseVoice hỗ trợ các tag ngôn ngữ zh, en, ja, ko, yue...
    language: auto
  FunASRServer:
    # Triển khai FunASR độc lập, dùng dịch vụ API của FunASR, chỉ cần 5 câu lệnh
    # Câu 1: mkdir -p ./funasr-runtime-resources/models
    # Câu 2: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # Sau khi chạy câu lệnh trên sẽ vào trong container, tiếp tục câu 3: cd FunASR/runtime
    # Đừng thoát container, tiếp tục chạy câu 4 trong container: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # Sau khi chạy câu lệnh trên sẽ vào trong container, tiếp tục câu 5: tail -f log.txt
    # Sau khi chạy xong câu 5, sẽ thấy log tải model, tải xong là có thể kết nối dùng
    # Trên đây là suy luận bằng CPU, nếu có GPU tham khảo chi tiết: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Nhận diện giọng nói local Sherpa-ONNX (cần tải model thủ công)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Loại model: sense_voice (đa ngôn ngữ) hoặc paraformer (chuyên tiếng Trung)
    model_type: sense_voice
  SherpaParaformerASR:
    # Model nhận diện giọng nói tiếng Trung, chạy được trên thiết bị hiệu năng thấp (cần tải model thủ công, ví dụ RK3566-2g)
    # Xem hướng dẫn cấu hình chi tiết tại: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Có thể đăng ký Key và thông tin liên quan tại đây
    # https://console.volcengine.com/speech/app
    # Điểm khác giữa DoubaoASR và DoubaoStreamASR: DoubaoASR tính phí theo lượt, DoubaoStreamASR tính phí theo thời gian
    # Thường thì tính phí theo lượt rẻ hơn, nhưng DoubaoStreamASR dùng công nghệ model lớn nên hiệu quả tốt hơn
    type: doubao
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcengine_input_common
    # Quy trình dùng hotword, từ thay thế: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    output_dir: tmp/
  DoubaoStreamASR:
    # Có thể đăng ký Key và thông tin liên quan tại đây
    # https://console.volcengine.com/speech/app
    # Điểm khác giữa DoubaoASR và DoubaoStreamASR: DoubaoASR tính phí theo lượt, DoubaoStreamASR tính phí theo thời gian
    # Địa chỉ mở dịch vụ https://console.volcengine.com/speech/service/10011
    # Thường thì tính phí theo lượt rẻ hơn, nhưng DoubaoStreamASR dùng công nghệ model lớn nên hiệu quả tốt hơn
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # Resource ID: bản theo giờ volc.bigasr.sauc.duration, bản đồng thời volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Quy trình dùng hotword, từ thay thế: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Có bật chế độ nhận diện đa ngôn ngữ hay không
    enable_multilingual: False
    # Nhận diện đa ngôn ngữ: khi key này để trống, model hỗ trợ nhận diện tiếng Trung, tiếng Anh, tiếng Thượng Hải, tiếng Mân Nam, tiếng Tứ Xuyên, Thiểm Tây, Quảng Đông. Khi đặt thành key cụ thể, nó sẽ nhận diện ngôn ngữ được chỉ định.
    # Tham khảo danh sách ngôn ngữ chi tiết https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Thời gian xác định im lặng (ms), mặc định 200ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Model nhận diện giọng nói Doubao 2.0 (dựa trên seed-asr của Volcengine)
    # Địa chỉ mở dịch vụ: https://console.volcengine.com/speech/service/10038
    # Giá rẻ hơn, nên dùng trong tình huống đồng thời cao
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # Resource ID: bản theo giờ volc.seedasr.sauc.duration, bản đồng thời volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Quy trình dùng hotword, từ thay thế: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Có bật chế độ nhận diện đa ngôn ngữ hay không
    enable_multilingual: False
    # Nhận diện đa ngôn ngữ: khi key này để trống, model hỗ trợ nhận diện tiếng Trung, tiếng Anh, tiếng Thượng Hải, tiếng Mân Nam, tiếng Tứ Xuyên, Thiểm Tây, Quảng Đông. Khi đặt thành key cụ thể, nó sẽ nhận diện ngôn ngữ được chỉ định.
    # Tham khảo danh sách ngôn ngữ chi tiết https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Thời gian xác định im lặng (ms), mặc định 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Địa chỉ đăng ký token: https://console.cloud.tencent.com/cam/capi
    # Nhận tài nguyên miễn phí: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: 你的腾讯语音合成服务appid
    secret_id: 你的腾讯语音合成服务secret_id
    secret_key: 你的腾讯语音合成服务secret_key
    output_dir: tmp/
  AliyunASR:
    # Dịch vụ tương tác giọng nói thông minh Alibaba Cloud, cần mở dịch vụ trên nền tảng Alibaba Cloud trước rồi lấy thông tin xác thực
    # Request HTTP POST, xử lý một lần toàn bộ audio
    # Địa chỉ nền tảng: https://nls-portal.console.aliyun.com/
    # Địa chỉ appkey: https://nls-portal.console.aliyun.com/applist
    # Địa chỉ token: https://nls-portal.console.aliyun.com/overview
    # Điểm khác giữa AliyunASR và AliyunStreamASR: AliyunASR dùng cho xử lý hàng loạt, AliyunStreamASR dùng cho tương tác thời gian thực
    # Thường thì ASR không streaming rẻ hơn (0.004 tệ/giây, ¥0.24/phút)
    # Nhưng AliyunStreamASR có tính thời gian thực tốt hơn (0.005 tệ/giây, ¥0.3/phút)
    # Định nghĩa loại ASR API
    type: aliyun
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Dịch vụ tương tác giọng nói thông minh Alibaba Cloud - nhận diện giọng nói streaming thời gian thực
    # Kết nối WebSocket, xử lý luồng audio thời gian thực
    # Địa chỉ nền tảng: https://nls-portal.console.aliyun.com/
    # Địa chỉ appkey: https://nls-portal.console.aliyun.com/applist
    # Địa chỉ token: https://nls-portal.console.aliyun.com/overview
    # Điểm khác giữa AliyunASR và AliyunStreamASR: AliyunASR dùng cho xử lý hàng loạt, AliyunStreamASR dùng cho tương tác thời gian thực
    # Thường thì ASR không streaming rẻ hơn (0.004 tệ/giây, ¥0.24/phút)
    # Nhưng AliyunStreamASR có tính thời gian thực tốt hơn (0.005 tệ/giây, ¥0.3/phút)
    # Định nghĩa loại ASR API
    type: aliyun_stream
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    # Chọn region server, có thể chọn server gần hơn để giảm độ trễ, ví dụ nls-gateway-cn-hangzhou.aliyuncs.com (Hàng Châu)...
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Thời gian phát hiện ngắt câu (ms), điều khiển sau bao lâu im lặng thì ngắt câu, mặc định 800ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Lấy AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Xem hạn mức tài nguyên: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: 你的百度语音技术AppID
    api_key: 你的百度语音技术APIKey
    secret_key: 你的百度语音技术SecretKey
    # Tham số ngôn ngữ, 1537 là tiếng phổ thông, tham khảo chi tiết: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # Dịch vụ nhận diện giọng nói OpenAI, cần tạo tổ chức trên nền tảng OpenAI và lấy api_key trước
    # Hỗ trợ nhận diện giọng nói nhiều ngôn ngữ như Trung, Anh, Nhật, Hàn, tham khảo tài liệu https://platform.openai.com/docs/guides/speech-to-text
    # Cần kết nối mạng
    # Các bước đăng ký:
    # 1. Đăng nhập OpenAI Platform. https://auth.openai.com/log-in
    # 2. Tạo api-key  https://platform.openai.com/settings/organization/api-keys
    # 3. Model có thể chọn gpt-4o-transcribe hoặc GPT-4o mini Transcribe
    type: openai
    api_key: 你的OpenAI API密钥
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Dịch vụ nhận diện giọng nói Groq, cần tạo API key trong Groq Console trước
    # Các bước đăng ký:
    # 1. Đăng nhập Groq Console. https://console.groq.com/home
    # 2. Tạo api-key  https://console.groq.com/keys
    # 3. Model có thể chọn whisper-large-v3-turbo hoặc whisper-large-v3 (distil-whisper-large-v3-en chỉ hỗ trợ phiên âm tiếng Anh)
    type: openai
    api_key: 你的Groq API密钥
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Website chính thức: https://alphacephei.com/vosk/
    # Hướng dẫn cấu hình:
    # 1. VOSK là thư viện nhận diện giọng nói offline, hỗ trợ nhiều ngôn ngữ
    # 2. Cần tải file model trước: https://alphacephei.com/vosk/models
    # 3. Model tiếng Trung nên dùng vosk-model-small-cn-0.22 hoặc vosk-model-cn-0.22
    # 4. Chạy hoàn toàn offline, không cần mạng
    # 5. File đầu ra lưu trong thư mục tmp/
    # Các bước sử dụng:
    # 1. Truy cập https://alphacephei.com/vosk/models để tải model tương ứng
    # 2. Giải nén file model vào thư mục models/vosk/ trong thư mục dự án
    # 3. Chỉ định đúng đường dẫn model trong cấu hình
    # 4. Lưu ý: model tiếng Trung của VOSK cho đầu ra không có dấu câu, giữa các từ có dấu cách
    type: vosk
    model_path: 你的模型路径，如：models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Dịch vụ nhận diện giọng nói Qwen3-ASR-Flash của Tongyi Qianwen, cần tạo API key trên nền tảng Alibaba Bailian trước
    # Các bước đăng ký:
    # 1. Đăng nhập nền tảng Alibaba Bailian. https://bailian.console.aliyun.com/
    # 2. Tạo API-KEY  https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash dựa trên nền tảng đa phương thức Tongyi Qianwen, hỗ trợ nhận diện đa ngôn ngữ, nhận diện hát, từ chối nhiễu...
    type: qwen3_asr_flash
    api_key: 你的阿里云百炼API密钥
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # Cấu hình tùy chọn ASR
    enable_lid: true  # Tự phát hiện ngôn ngữ
    enable_itn: true  # Chuẩn hóa văn bản ngược
    #language: "zh"  # Ngôn ngữ, hỗ trợ zh, en, ja, ko...
    context: ""  # Thông tin ngữ cảnh, dùng để nâng cao độ chính xác nhận diện, không quá 10000 Token
  XunfeiStreamASR:
    # Dịch vụ nhận diện giọng nói streaming iFlytek
    # Cần tạo ứng dụng trên nền tảng mở iFlytek trước để lấy các thông tin xác thực sau
    # Địa chỉ nền tảng mở iFlytek: https://www.xfyun.cn/
    # Sau khi tạo ứng dụng, lấy trong "Ứng dụng của tôi":
    # - APPID
    # - APISecret  
    # - APIKey
    type: xunfei_stream
    # Tham số bắt buộc - thông tin ứng dụng nền tảng mở iFlytek
    app_id: 你的APPID
    api_key: 你的APIKey
    api_secret: 你的APISecret
    # Cấu hình tham số nhận diện
    domain: slm # Lĩnh vực nhận diện, iat: ngôn ngữ thường ngày, medical: y tế, finance: tài chính...
    language: zh_cn # Ngôn ngữ, zh_cn: tiếng Trung, en_us: tiếng Anh
    accent: mandarin # Phương ngữ, mandarin: tiếng phổ thông
    # Điều chỉnh tham số xử lý audio để nâng cao chất lượng nhận diện giọng nói dài
    output_dir: tmp/
  AliyunBLStreamASR:
    # Dịch vụ nhận diện giọng nói thời gian thực Paraformer của Alibaba Bailian
    # Nhận diện giọng nói streaming thời gian thực qua WebSocket, hỗ trợ đa ngôn ngữ, hotword tùy chỉnh, ngắt câu theo ngữ nghĩa và các tính năng nâng cao
    # Địa chỉ nền tảng: https://bailian.console.aliyun.com/
    # Địa chỉ API Key: https://bailian.console.aliyun.com/#/api-key
    # Địa chỉ tài liệu: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Model hỗ trợ: paraformer-realtime-v2 (khuyên dùng), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Tham số bắt buộc
    api_key: 你的阿里云百炼API密钥
    # Chọn model, nên dùng bản v2
    model: paraformer-realtime-v2
    # Định dạng audio và sample rate
    format: pcm
    sample_rate: 16000  # v2 hỗ trợ mọi sample rate, v1 chỉ hỗ trợ 16000, bản 8k chỉ hỗ trợ 8000
    # Tham số tùy chọn
    disfluency_removal_enabled: false  # Có lọc từ cảm thán (như "ừm", "à"...) hay không
    semantic_punctuation_enabled: false  # Ngắt câu theo ngữ nghĩa (true: tình huống họp, chính xác; false: ngắt câu bằng VAD, tình huống tương tác, độ trễ thấp)
    max_sentence_silence: 200  # Ngưỡng thời gian im lặng ngắt câu của VAD (ms), khoảng 200-6000, chỉ có hiệu lực khi ngắt câu bằng VAD
    multi_threshold_mode_enabled: false  # Ngăn VAD ngắt câu cắt quá dài, chỉ có hiệu lực khi ngắt câu bằng VAD
    punctuation_prediction_enabled: true  # Có tự thêm dấu câu hay không
    inverse_text_normalization_enabled: true  # Có bật ITN (chuyển số tiếng Trung thành số Ả Rập) hay không
    # Địa chỉ tài liệu tùy chỉnh hotword: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # ID hotword (tùy chọn)
    # language_hints: ["zh", "en"]  # Chỉ định ngôn ngữ (tùy chọn), hỗ trợ zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/  
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # Nếu khoảng ngừng khi nói khá dài, có thể đặt giá trị này lớn hơn

LLM:
  # Mọi type openai đều có thể sửa siêu tham số, lấy AliLLM làm ví dụ
