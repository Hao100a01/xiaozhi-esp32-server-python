# Docker cài đặt Server

version: '3'
services:
  xiaozhi-esp32-server:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
    ports:
      # Websocket server
      - "8000:8000"
      # Port của dịch vụ http, dùng cho OTA đơn giản (deploy đơn dịch vụ) và giao diện phân tích hình ảnh
      - "8003:8003"
    volumes:
      # Thư mục file cấu hình
      - ./data:/opt/xiaozhi-esp32-server/data
      # Mount file model, rất quan trọng
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt