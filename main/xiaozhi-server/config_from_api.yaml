# Nếu bạn chỉ muốn cài đặt gọn nhẹ xiaozhi-server, chỉ dùng file cấu hình local thì không cần quan tâm file này, không cần sửa bất cứ gì trong file này
# Nếu bạn muốn lấy cấu hình từ manager-api, hãy đọc tiếp:
# Hãy copy file này vào thư mục xiaozhi-server/data, nếu chưa có thư mục data thì tạo mới, và đổi tên file đã copy thành.config.yaml
# Lưu ý nếu trong thư mục data đã có file.config.yaml thì hãy xóa nó trước
# Khởi động manager-api và manager-web trước, đăng ký một tài khoản, tài khoản đăng ký đầu tiên chính là quản trị viên
# Dùng tài khoản quản trị viên, vào trang, tìm, copy giá trị của nó, lưu ý mỗi lần deploy từ đầu thì server.secret đều thay đổi
# Mở file.config.yaml trong thư mục data, sửa manager-api.secret thành server.secret vừa copy ở trên
server:
ip: 0.0.0.0
port: 8000
# Port của dịch vụ http, dùng cho giao diện phân tích hình ảnh
http_port: 8003
# Địa chỉ giao diện phân tích hình ảnh
# Địa chỉ giao diện phân tích hình ảnh gửi về cho thiết bị
# Nếu viết theo mặc định bên dưới, hệ thống sẽ tự sinh địa chỉ nhận diện hình ảnh và in ra log khởi động, bạn có thể mở trình duyệt truy cập địa chỉ đó để kiểm tra
# Khi deploy bằng docker hoặc deploy public (dùng ssl, tên miền) thì địa chỉ tự sinh chưa chắc chính xác
# Vì vậy khi deploy bằng docker, hãy đặt vision_explain thành địa chỉ mạng LAN
# Nếu bạn deploy public, hãy đặt vision_explain thành địa chỉ public
vision_explain: http://IP_HOAC_TEN_MIEN:CONG/mcp/vision/explain
manager-api:
# Địa chỉ manager-api của bạn, nên dùng IP mạng LAN
# Nếu deploy bằng docker, hãy điền thành http://xiaozhi-esp32-server-web:8002/xiaozhi
url: http://127.0.0.1:8002/xiaozhi
# Token của manager-api, chính là server.secret vừa copy ở trên
secret: GIÁ_TRỊ_server.secret_CỦA_BẠN
# File template prompt hệ thống mặc định
prompt_template: agent-base-prompt.txt
